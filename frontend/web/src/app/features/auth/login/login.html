<!--
  Login de MEDISTA.
  Estructura: un fondo (.login-wrapper) con una tarjeta encima (.login-card)
  partida en dos paneles: marca a la izquierda y formulario a la derecha.
  En pantallas angostas los paneles se apilan (ver login.scss, @media).
-->
<main class="login-wrapper">
  <!-- Fondo animado: la foto del médico teñida de navy (scene/). -->
  <app-login-scene />

  <div class="login-card">

    <!-- Panel de marca. <section> con aria-label: el lector de pantalla lo
         anuncia como "Medista, región" y no como un div sin nombre. -->
    <section class="login-brand" aria-label="Medista">
      <!-- El caduceo animado (shared/components/caduceus): es el protagonista
           del panel, sin texto. El nombre "Medista" lo anuncia el aria-label
           de la sección para lectores de pantalla. -->
      <app-caduceus class="login-brand__mark" />
    </section>

    <!-- Panel del formulario -->
    <section class="login-panel">
      <div class="login-panel__content">
        <header class="login-header">
          <!-- h1: es el título principal de la página (antes de esto no hay otro). -->
          <h1 class="login-title">¡Bienvenido de vuelta!</h1>
          <p class="login-subtitle">Ingresa tus credenciales institucionales para continuar</p>
        </header>

        <form class="login-form">

          <mat-form-field appearance="outline" class="login-field">
            <mat-label>Correo institucional</mat-label>
            <!-- matIconPrefix: Material coloca el icono dentro del borde, a la izquierda. -->
            <app-icon matIconPrefix name="mail" class="login-field__icon" />
            <input
              matInput
              type="email"
              placeholder="usuario@tecazuay.edu.ec"
              autocomplete="username"
              inputmode="email"
              spellcheck="false"
            >
          </mat-form-field>

          <mat-form-field appearance="outline" class="login-field">
            <mat-label>Contraseña</mat-label>
            <app-icon matIconPrefix name="lock" class="login-field__icon" />
            <input
              matInput
              type="password"
              autocomplete="current-password"
            >
          </mat-form-field>

          <div class="login-forgot">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button mat-flat-button class="login-submit" type="submit">
            Iniciar sesión
          </button>
        </form>

        <p class="login-footer">Cuenca, Ecuador · INSTITUCION © 2026</p>
      </div>
    </section>

  </div>
</main>
